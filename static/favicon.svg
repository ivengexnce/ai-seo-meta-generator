<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
  <!-- Search ring representing SEO & Google Discovery -->
  <circle cx="27" cy="27" r="13" fill="none" stroke="url(#sparkleGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M37 37 L50 50" stroke="url(#sparkleGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 4-point AI Star representing Gemini Intelligence -->
  <path d="M27 18 C27 23 23 27 18 27 C23 27 27 31 27 36 C27 31 31 27 36 27 C31 27 27 23 27 18 Z" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="43" cy="17" r="3" fill="#a855f7" filter="url(#glow)"/>
</svg>
